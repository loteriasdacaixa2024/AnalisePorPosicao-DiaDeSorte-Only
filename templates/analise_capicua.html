{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2>
                    <i class="bi bi-symmetry-vertical"></i> Análise de Números Capicua
                </h2>
                <div>
                    <a href="/" class="btn btn-secondary me-2">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                    <button class="btn btn-primary" onclick="carregarAnalise()">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
            <p class="text-muted">
                Analisa a frequência de números capicua (11, 22) nos sorteios
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-3">Carregando análise...</p>
            </div>

            <div id="resultado" style="display: none;"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mt-4" id="insightsCard" style="display: none;">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-lightbulb-fill"></i> Insights Inteligentes
                    </h5>
                </div>
                <div class="card-body">
                    <div id="insightsContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function carregarAnalise() {
    const loading = document.getElementById('loading');
    const resultado = document.getElementById('resultado');

    loading.style.display = 'block';
    resultado.style.display = 'none';
    document.getElementById('insightsCard').style.display = 'none';

    fetch('/api/analise/numeros-capicua')
        .then(response => response.json())
        .then(data => {
            exibirResultado(data);
            gerarInsights(data);
            loading.style.display = 'none';
        })
        .catch(error => {
            console.error('Erro:', error);
            loading.style.display = 'none';
            resultado.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Erro ao carregar análise: ${error.message}
                </div>
            `;
            resultado.style.display = 'block';
        });
}

function exibirResultado(data) {
    const resultado = document.getElementById('resultado');

    let html = `
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-bar-chart-fill"></i> Resumo Geral (${data.total_concursos} concursos)
                </h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="alert alert-success">
                            <strong>Sorteios COM capicua:</strong><br>
                            ${data.sorteios_com_capicua} (${data.percentual_com_capicua}%)
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="alert alert-danger">
                            <strong>Sorteios SEM capicua:</strong><br>
                            ${data.sorteios_sem_capicua} (${data.percentual_sem_capicua}%)
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-list-ol"></i> Números Capicua Disponíveis no Dia de Sorte
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Número</th>
                                <th>Frequência</th>
                                <th>Percentual</th>
                                <th>Último Concurso</th>
                                <th>Atraso</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
    `;

    data.lista_capicuas.forEach(capicua => {
        const badgeColor = capicua.atraso > 100 ? 'danger' : capicua.atraso > 50 ? 'warning' : 'success';

        html += `
            <tr>
                <td><span class="badge bg-primary fs-5">${capicua.numero}</span></td>
                <td><strong>${capicua.frequencia}x</strong></td>
                <td>${capicua.porcentagem}%</td>
                <td>${capicua.ultimo_concurso || '-'}</td>
                <td><span class="badge bg-${badgeColor}">${capicua.atraso}</span></td>
                <td>
                    ${capicua.frequencia > 0 ? '<span class="badge bg-success">Já saiu</span>' : '<span class="badge bg-secondary">Nunca saiu</span>'}
                </td>
            </tr>
        `;
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    <i class="bi bi-pie-chart-fill"></i> Distribuição por Quantidade
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Quantidade de Capicuas</th>
                                <th>Frequência</th>
                                <th>Percentual</th>
                                <th>Barra Visual</th>
                            </tr>
                        </thead>
                        <tbody>
    `;

    data.distribuicao_quantidade.forEach(dist => {
        const larguraBarra = Math.min(dist.porcentagem * 2, 100);
        const rowClass = dist.quantidade === 0 ? 'table-danger' : dist.quantidade === 1 ? 'table-success' : 'table-warning';

        html += `
            <tr class="${rowClass}">
                <td><strong>${dist.quantidade}</strong></td>
                <td>${dist.frequencia}x</td>
                <td>${dist.porcentagem}%</td>
                <td>
                    <div class="progress" style="height: 25px;">
                        <div class="progress-bar ${dist.quantidade === 0 ? 'bg-danger' : 'bg-success'}"
                             role="progressbar"
                             style="width: ${larguraBarra}%"
                             aria-valuenow="${dist.porcentagem}"
                             aria-valuemin="0"
                             aria-valuemax="100">
                            ${dist.porcentagem}%
                        </div>
                    </div>
                </td>
            </tr>
        `;
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;

    if (data.detalhes_sorteios.length > 0) {
        html += `
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-list-check"></i> Sorteios com Capicua (últimos 20)
                    </h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                        <table class="table table-sm table-striped">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th>Concurso</th>
                                    <th>Data</th>
                                    <th>Números</th>
                                    <th>Capicuas</th>
                                    <th>Qtd</th>
                                </tr>
                            </thead>
                            <tbody>
        `;

        data.detalhes_sorteios.slice(0, 20).forEach(sorteio => {
            html += `
                <tr>
                    <td><strong>${sorteio.concurso}</strong></td>
                    <td>${sorteio.data}</td>
                    <td>${sorteio.numeros.join(', ')}</td>
                    <td><span class="text-primary fw-bold">${sorteio.capicuas.join(', ')}</span></td>
                    <td><span class="badge bg-success">${sorteio.quantidade}</span></td>
                </tr>
            `;
        });

        html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
    }

    resultado.innerHTML = html;
    resultado.style.display = 'block';
}

function gerarInsights(data) {
    const insightsCard = document.getElementById('insightsCard');
    const insightsContent = document.getElementById('insightsContent');

    const capicua_mais_frequente = data.lista_capicuas[0];
    const capicua_menos_frequente = data.lista_capicuas[data.lista_capicuas.length - 1];

    let html = '';

    if (data.percentual_com_capicua > 0) {
        html += `
            <div class="alert alert-${data.percentual_com_capicua > 20 ? 'success' : 'warning'}">
                <h6 class="fw-bold"><i class="bi bi-check-circle-fill"></i> Frequência de Capicuas:</h6>
                <p class="mb-0">
                    <strong>${data.percentual_com_capicua}%</strong> dos sorteios (${data.sorteios_com_capicua} concursos)
                    contêm pelo menos 1 número capicua!
                </p>
            </div>
        `;
    } else {
        html += `
            <div class="alert alert-danger">
                <h6 class="fw-bold"><i class="bi bi-x-circle-fill"></i> Nenhum Capicua Encontrado:</h6>
                <p class="mb-0">
                    Nenhum sorteio até o momento teve números capicua (11 ou 22).
                </p>
            </div>
        `;
    }

    if (capicua_mais_frequente.frequencia > 0) {
        html += `
            <div class="alert alert-info">
                <h6 class="fw-bold"><i class="bi bi-star-fill"></i> Capicua Mais Frequente:</h6>
                <p class="mb-0">
                    O número <strong>${capicua_mais_frequente.numero}</strong> apareceu <strong>${capicua_mais_frequente.frequencia}</strong> vezes
                    (${capicua_mais_frequente.porcentagem}% dos sorteios).<br>
                    Último aparecimento: concurso ${capicua_mais_frequente.ultimo_concurso} | Atraso: ${capicua_mais_frequente.atraso}
                </p>
            </div>
        `;
    }

    if (capicua_menos_frequente.frequencia === 0) {
        html += `
            <div class="alert alert-secondary">
                <h6 class="fw-bold"><i class="bi bi-info-circle-fill"></i> Capicua Nunca Sorteado:</h6>
                <p class="mb-0">
                    O número <strong>${capicua_menos_frequente.numero}</strong> nunca apareceu em nenhum sorteio até o momento.
                </p>
            </div>
        `;
    }

    html += `
        <div class="alert alert-primary">
            <h6 class="fw-bold"><i class="bi bi-lightbulb-fill"></i> Recomendações Estratégicas:</h6>
            <ul class="mb-0">
    `;

    if (data.percentual_com_capicua > 0) {
        html += `
                <li>Números capicua aparecem em <strong>${data.percentual_com_capicua}%</strong> dos sorteios</li>
                <li>Não é obrigatório incluir capicuas, mas pode considerar o <strong>${capicua_mais_frequente.numero}</strong></li>
        `;
    } else {
        html += `
                <li>Números capicua são <strong>extremamente raros</strong> no Dia de Sorte</li>
                <li>Considere evitar capicuas em suas apostas</li>
        `;
    }

    html += `
                <li>Lembre-se: apenas 11 e 22 são capicuas disponíveis (01-31)</li>
            </ul>
        </div>

        <div class="alert alert-light border">
            <h6 class="fw-bold"><i class="bi bi-info-circle-fill"></i> O que são Números Capicua?</h6>
            <p class="mb-0">
                <strong>Números capicua</strong> (ou palíndromos numéricos) são números que se leem da mesma forma da esquerda para a direita e vice-versa.<br>
                No Dia de Sorte (01-31), existem apenas <strong>2 números capicua</strong>:<br>
                • <strong>11</strong> (lê-se da mesma forma ao contrário)<br>
                • <strong>22</strong> (lê-se da mesma forma ao contrário)<br>
                Outros exemplos fora do Dia de Sorte: 33, 44, 101, 121, 131, etc.
            </p>
        </div>
    `;

    insightsContent.innerHTML = html;
    insightsCard.style.display = 'block';
}

window.onload = function() {
    carregarAnalise();
};
</script>
{% endblock %}
