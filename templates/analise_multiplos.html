{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2>
                    <i class="bi bi-calculator"></i> Análise de Múltiplos (3, 5, 7)
                </h2>
                <div>
                    <a href="/" class="btn btn-secondary me-2">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                    <button class="btn btn-primary" onclick="carregarAnalise()">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
            <p class="text-muted">
                Analisa a quantidade de múltiplos de 3, 5 e 7 que aparecem nos sorteios
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-3">Carregando análise...</p>
            </div>

            <div id="resultado" style="display: none;"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mt-4" id="insightsCard" style="display: none;">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-lightbulb-fill"></i> Insights Inteligentes
                    </h5>
                </div>
                <div class="card-body">
                    <div id="insightsContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function carregarAnalise() {
    const loading = document.getElementById('loading');
    const resultado = document.getElementById('resultado');

    loading.style.display = 'block';
    resultado.style.display = 'none';
    document.getElementById('insightsCard').style.display = 'none';

    fetch('/api/analise/multiplos')
        .then(response => response.json())
        .then(data => {
            exibirResultado(data);
            gerarInsights(data);
            loading.style.display = 'none';
        })
        .catch(error => {
            console.error('Erro:', error);
            loading.style.display = 'none';
            resultado.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Erro ao carregar análise: ${error.message}
                </div>
            `;
            resultado.style.display = 'block';
        });
}

function exibirResultado(data) {
    const resultado = document.getElementById('resultado');

    let html = `
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-bar-chart-fill"></i> Resumo Geral (${data.total_concursos} concursos)
                </h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <div class="alert alert-success text-center">
                            <h4>${data.media_mult3}</h4>
                            <strong>Média de Múltiplos de 3</strong><br>
                            <small>por sorteio</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-info text-center">
                            <h4>${data.media_mult5}</h4>
                            <strong>Média de Múltiplos de 5</strong><br>
                            <small>por sorteio</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="alert alert-warning text-center">
                            <h4>${data.media_mult7}</h4>
                            <strong>Média de Múltiplos de 7</strong><br>
                            <small>por sorteio</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    <i class="bi bi-trophy-fill"></i> Padrões de Distribuição
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Posição</th>
                                <th>Padrão</th>
                                <th>Mult 3</th>
                                <th>Mult 5</th>
                                <th>Mult 7</th>
                                <th>Frequência</th>
                                <th>Percentual</th>
                                <th>Último</th>
                                <th>Atraso</th>
                                <th>Detalhes</th>
                            </tr>
                        </thead>
                        <tbody>
    `;

    const medalhas = ['🥇', '🥈', '🥉'];

    data.padroes.forEach((padrao, index) => {
        const posicao = index < 3 ? medalhas[index] : `${index + 1}º`;
        const destaque = index < 3 ? 'table-success' : '';
        const badgeColor = padrao.atraso > 50 ? 'danger' : padrao.atraso > 20 ? 'warning' : 'success';

        html += `
            <tr class="${destaque}">
                <td><strong>${posicao}</strong></td>
                <td><small>${padrao.padrao}</small></td>
                <td><span class="badge bg-success">${padrao.mult_3}</span></td>
                <td><span class="badge bg-info">${padrao.mult_5}</span></td>
                <td><span class="badge bg-warning">${padrao.mult_7}</span></td>
                <td><strong>${padrao.frequencia}x</strong></td>
                <td>${padrao.percentual}%</td>
                <td>${padrao.ultimo_concurso}</td>
                <td><span class="badge bg-${badgeColor}">${padrao.atraso}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-info" onclick="toggleDetalhes('detalhes-${index}')">
                        <i class="bi bi-eye"></i>
                    </button>
                </td>
            </tr>
            <tr id="detalhes-${index}" style="display: none;">
                <td colspan="10">
                    <div class="p-3 bg-light">
                        <h6>Últimos 5 concursos com este padrão:</h6>
                        <ul class="mb-0">
        `;

        padrao.concursos.slice(0, 5).forEach(concurso => {
            html += `
                <li>
                    <strong>Concurso ${concurso.concurso}</strong> (${concurso.data}):
                    ${concurso.numeros.join(', ')}
                    <span class="text-success">[M3: ${concurso.mult_3.join(', ') || '-'}]</span>
                    <span class="text-info">[M5: ${concurso.mult_5.join(', ') || '-'}]</span>
                    <span class="text-warning">[M7: ${concurso.mult_7.join(', ') || '-'}]</span>
                </li>
            `;
        });

        html += `
                        </ul>
                    </div>
                </td>
            </tr>
        `;
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">
                        <h6 class="mb-0"><i class="bi bi-star-fill"></i> Top 10 Múltiplos de 3</h6>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
    `;

    data.top_multiplos_3.forEach((item, index) => {
        const posicao = index < 3 ? medalhas[index] : `${index + 1}º`;

        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${posicao} <strong>${item.numero}</strong></span>
                <span class="badge bg-success rounded-pill">${item.frequencia}x</span>
            </li>
        `;
    });

    html += `
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-info text-white">
                        <h6 class="mb-0"><i class="bi bi-star-fill"></i> Top 10 Múltiplos de 5</h6>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
    `;

    data.top_multiplos_5.forEach((item, index) => {
        const posicao = index < 3 ? medalhas[index] : `${index + 1}º`;

        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${posicao} <strong>${item.numero}</strong></span>
                <span class="badge bg-info rounded-pill">${item.frequencia}x</span>
            </li>
        `;
    });

    html += `
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-warning text-white">
                        <h6 class="mb-0"><i class="bi bi-star-fill"></i> Top 10 Múltiplos de 7</h6>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
    `;

    data.top_multiplos_7.forEach((item, index) => {
        const posicao = index < 3 ? medalhas[index] : `${index + 1}º`;

        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${posicao} <strong>${item.numero}</strong></span>
                <span class="badge bg-warning rounded-pill">${item.frequencia}x</span>
            </li>
        `;
    });

    html += `
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    `;

    resultado.innerHTML = html;
    resultado.style.display = 'block';
}

function toggleDetalhes(id) {
    const elemento = document.getElementById(id);
    if (elemento.style.display === 'none') {
        elemento.style.display = 'table-row';
    } else {
        elemento.style.display = 'none';
    }
}

function gerarInsights(data) {
    const insightsCard = document.getElementById('insightsCard');
    const insightsContent = document.getElementById('insightsContent');

    const top3 = data.padroes.slice(0, 3);
    const medalhas = ['🥇', '🥈', '🥉'];

    let html = `
        <div class="mb-4">
            <h6 class="fw-bold"><i class="bi bi-trophy-fill text-warning"></i> Top 3 Padrões Mais Frequentes:</h6>
            <ul class="list-group">
    `;

    top3.forEach((padrao, index) => {
        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${medalhas[index]} <strong>${padrao.padrao}</strong></span>
                <span>
                    <span class="badge bg-primary rounded-pill">${padrao.frequencia}x</span>
                    <span class="badge bg-info rounded-pill">${padrao.percentual}%</span>
                </span>
            </li>
        `;
    });

    html += `
            </ul>
        </div>

        <div class="alert alert-success">
            <h6 class="fw-bold"><i class="bi bi-check-circle-fill"></i> Múltiplos de 3:</h6>
            <p class="mb-0">
                Média de <strong>${data.media_mult3}</strong> múltiplos de 3 por sorteio.<br>
                Múltiplos de 3 no Dia de Sorte (01-31): 3, 6, 9, 12, 15, 18, 21, 24, 27, 30 (10 números)
            </p>
        </div>

        <div class="alert alert-info">
            <h6 class="fw-bold"><i class="bi bi-check-circle-fill"></i> Múltiplos de 5:</h6>
            <p class="mb-0">
                Média de <strong>${data.media_mult5}</strong> múltiplos de 5 por sorteio.<br>
                Múltiplos de 5 no Dia de Sorte (01-31): 5, 10, 15, 20, 25, 30 (6 números)
            </p>
        </div>

        <div class="alert alert-warning">
            <h6 class="fw-bold"><i class="bi bi-check-circle-fill"></i> Múltiplos de 7:</h6>
            <p class="mb-0">
                Média de <strong>${data.media_mult7}</strong> múltiplos de 7 por sorteio.<br>
                Múltiplos de 7 no Dia de Sorte (01-31): 7, 14, 21, 28 (4 números)
            </p>
        </div>

        <div class="alert alert-primary">
            <h6 class="fw-bold"><i class="bi bi-lightbulb-fill"></i> Recomendações Estratégicas:</h6>
            <ul class="mb-0">
                <li>Padrão mais comum: <strong>${top3[0].padrao}</strong> (${top3[0].percentual}% dos casos)</li>
                <li>Inclua cerca de <strong>${Math.round(data.media_mult3)}</strong> múltiplos de 3 em seu jogo</li>
                <li>Inclua cerca de <strong>${Math.round(data.media_mult5)}</strong> múltiplos de 5 em seu jogo</li>
                <li>Inclua cerca de <strong>${Math.round(data.media_mult7)}</strong> múltiplos de 7 em seu jogo</li>
            </ul>
        </div>

        <div class="alert alert-light border">
            <h6 class="fw-bold"><i class="bi bi-info-circle-fill"></i> Como Interpretar:</h6>
            <p class="mb-0">
                Esta análise mostra quantos <strong>múltiplos de 3, 5 e 7</strong> aparecem em cada sorteio.<br>
                <strong>Múltiplos de 3:</strong> Números divisíveis por 3 (3, 6, 9, 12, 15...)<br>
                <strong>Múltiplos de 5:</strong> Números divisíveis por 5 (5, 10, 15, 20, 25, 30)<br>
                <strong>Múltiplos de 7:</strong> Números divisíveis por 7 (7, 14, 21, 28)<br>
                <strong>Observação:</strong> O número 15 é múltiplo de 3 E 5. O número 21 é múltiplo de 3 E 7.
            </p>
        </div>
    `;

    insightsContent.innerHTML = html;
    insightsCard.style.display = 'block';
}

window.onload = function() {
    carregarAnalise();
};
</script>
{% endblock %}
