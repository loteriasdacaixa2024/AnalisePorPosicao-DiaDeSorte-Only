{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2>
                    <i class="bi bi-calendar-month"></i> Mês da Sorte - Evolução Temporal
                </h2>
                <div>
                    <a href="/" class="btn btn-secondary me-2">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                    <button class="btn btn-primary" onclick="carregarAnalise()">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
            <p class="text-muted">
                Analisa a evolução dos meses sorteados ao longo do tempo, tendências e sazonalidade
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-3">Carregando análise...</p>
            </div>

            <div id="resultado" style="display: none;"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mt-4" id="insightsCard" style="display: none;">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-lightbulb-fill"></i> Insights Inteligentes
                    </h5>
                </div>
                <div class="card-body">
                    <div id="insightsContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function carregarAnalise() {
    const loading = document.getElementById('loading');
    const resultado = document.getElementById('resultado');

    loading.style.display = 'block';
    resultado.style.display = 'none';
    document.getElementById('insightsCard').style.display = 'none';

    fetch('/api/analise/evolucao-meses')
        .then(response => response.json())
        .then(data => {
            exibirResultado(data);
            gerarInsights(data);
            loading.style.display = 'none';
        })
        .catch(error => {
            console.error('Erro:', error);
            loading.style.display = 'none';
            resultado.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Erro ao carregar análise: ${error.message}
                </div>
            `;
            resultado.style.display = 'block';
        });
}

function exibirResultado(data) {
    const resultado = document.getElementById('resultado');

    let html = `
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-bar-chart-fill"></i> Distribuição Geral (${data.total_concursos} concursos - ${data.primeiro_ano} a ${data.ultimo_ano})
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Posição</th>
                                <th>Mês</th>
                                <th>Frequência</th>
                                <th>Percentual</th>
                                <th>Barra Visual</th>
                            </tr>
                        </thead>
                        <tbody>
    `;

    const medalhas = ['🥇', '🥈', '🥉'];

    data.distribuicao_geral.forEach((mes, index) => {
        const posicao = index < 3 ? medalhas[index] : `${index + 1}º`;
        const destaque = index < 3 ? 'table-success' : '';
        const larguraBarra = Math.min(mes.porcentagem * 10, 100);

        html += `
            <tr class="${destaque}">
                <td><strong>${posicao}</strong></td>
                <td><strong>${mes.nome}</strong></td>
                <td>${mes.frequencia}x</td>
                <td>${mes.porcentagem}%</td>
                <td>
                    <div class="progress" style="height: 25px;">
                        <div class="progress-bar bg-success" role="progressbar"
                             style="width: ${larguraBarra}%"
                             aria-valuenow="${mes.porcentagem}"
                             aria-valuemin="0"
                             aria-valuemax="100">
                            ${mes.porcentagem}%
                        </div>
                    </div>
                </td>
            </tr>
        `;
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-graph-up"></i> Tendências por Mês
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-striped">
                        <thead class="table-light">
                            <tr>
                                <th>Mês</th>
                                <th>Tendência</th>
                            </tr>
                        </thead>
                        <tbody>
    `;

    data.tendencias.forEach(tend => {
        let badgeColor = 'secondary';
        let icone = '➖';

        if (tend.tendencia === 'Crescente') {
            badgeColor = 'success';
            icone = '📈';
        } else if (tend.tendencia === 'Decrescente') {
            badgeColor = 'danger';
            icone = '📉';
        } else if (tend.tendencia === 'Estável') {
            badgeColor = 'info';
            icone = '➖';
        }

        html += `
            <tr>
                <td><strong>${tend.nome}</strong></td>
                <td><span class="badge bg-${badgeColor}">${icone} ${tend.tendencia}</span></td>
            </tr>
        `;
    });

    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">
                    <i class="bi bi-calendar3"></i> Evolução Ano a Ano
                </h5>
            </div>
            <div class="card-body">
    `;

    data.evolucao_por_ano.forEach(ano_data => {
        html += `
            <div class="mb-4">
                <h6 class="fw-bold"><i class="bi bi-calendar-check"></i> Ano ${ano_data.ano}</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Mês</th>
                                <th>Freq</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody>
        `;

        ano_data.meses.forEach(mes => {
            const rowClass = mes.frequencia > 0 ? '' : 'table-secondary';

            html += `
                <tr class="${rowClass}">
                    <td><small>${mes.nome}</small></td>
                    <td><strong>${mes.frequencia}</strong></td>
                    <td>${mes.porcentagem}%</td>
                </tr>
            `;
        });

        html += `
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    });

    html += `
            </div>
        </div>
    `;

    resultado.innerHTML = html;
    resultado.style.display = 'block';
}

function gerarInsights(data) {
    const insightsCard = document.getElementById('insightsCard');
    const insightsContent = document.getElementById('insightsContent');

    const medalhas = ['🥇', '🥈', '🥉'];

    const crescentes = data.tendencias.filter(t => t.tendencia === 'Crescente');
    const decrescentes = data.tendencias.filter(t => t.tendencia === 'Decrescente');

    let html = `
        <div class="mb-4">
            <h6 class="fw-bold"><i class="bi bi-trophy-fill text-warning"></i> Top 3 Meses Mais Sorteados:</h6>
            <ul class="list-group">
    `;

    data.meses_quentes.forEach((mes, index) => {
        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>${medalhas[index]} <strong>${mes.nome}</strong></span>
                <span>
                    <span class="badge bg-primary rounded-pill">${mes.frequencia}x</span>
                    <span class="badge bg-info rounded-pill">${mes.porcentagem}%</span>
                </span>
            </li>
        `;
    });

    html += `
            </ul>
        </div>

        <div class="mb-4">
            <h6 class="fw-bold"><i class="bi bi-snow"></i> 3 Meses Menos Sorteados:</h6>
            <ul class="list-group">
    `;

    data.meses_frios.forEach((mes, index) => {
        html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><strong>${mes.nome}</strong></span>
                <span>
                    <span class="badge bg-secondary rounded-pill">${mes.frequencia}x</span>
                    <span class="badge bg-dark rounded-pill">${mes.porcentagem}%</span>
                </span>
            </li>
        `;
    });

    html += `
            </ul>
        </div>
    `;

    if (crescentes.length > 0) {
        html += `
            <div class="alert alert-success">
                <h6 class="fw-bold"><i class="bi bi-graph-up-arrow"></i> Meses em Tendência CRESCENTE:</h6>
                <p class="mb-0">
        `;

        crescentes.forEach(mes => {
            html += `<span class="badge bg-success me-1">${mes.nome}</span>`;
        });

        html += `
                    <br><small>Estes meses estão sendo sorteados com mais frequência nos últimos anos!</small>
                </p>
            </div>
        `;
    }

    if (decrescentes.length > 0) {
        html += `
            <div class="alert alert-warning">
                <h6 class="fw-bold"><i class="bi bi-graph-down-arrow"></i> Meses em Tendência DECRESCENTE:</h6>
                <p class="mb-0">
        `;

        decrescentes.forEach(mes => {
            html += `<span class="badge bg-warning me-1">${mes.nome}</span>`;
        });

        html += `
                    <br><small>Estes meses estão sendo sorteados com menos frequência nos últimos anos!</small>
                </p>
            </div>
        `;
    }

    html += `
        <div class="alert alert-primary">
            <h6 class="fw-bold"><i class="bi bi-lightbulb-fill"></i> Recomendações Estratégicas:</h6>
            <ul class="mb-0">
                <li>Priorize o mês <strong>${data.meses_quentes[0].nome}</strong> (mais sorteado - ${data.meses_quentes[0].porcentagem}%)</li>
                <li>Considere também <strong>${data.meses_quentes[1].nome}</strong> e <strong>${data.meses_quentes[2].nome}</strong></li>
                <li>Evite os meses <strong>${data.meses_frios[0].nome}</strong> e <strong>${data.meses_frios[1].nome}</strong> (menos frequentes)</li>
                ${crescentes.length > 0 ? `<li>Meses em alta: ${crescentes.map(m => m.nome).join(', ')}</li>` : ''}
            </ul>
        </div>

        <div class="alert alert-light border">
            <h6 class="fw-bold"><i class="bi bi-info-circle-fill"></i> Como Interpretar:</h6>
            <p class="mb-0">
                Esta análise mostra a <strong>evolução temporal</strong> do Mês da Sorte ao longo dos anos.<br>
                <strong>Tendência Crescente:</strong> Mês está sendo mais sorteado recentemente<br>
                <strong>Tendência Decrescente:</strong> Mês está sendo menos sorteado recentemente<br>
                <strong>Tendência Estável:</strong> Mês mantém frequência constante<br>
                Período analisado: <strong>${data.primeiro_ano} a ${data.ultimo_ano}</strong>
            </p>
        </div>
    `;

    insightsContent.innerHTML = html;
    insightsCard.style.display = 'block';
}

window.onload = function() {
    carregarAnalise();
};
</script>
{% endblock %}
