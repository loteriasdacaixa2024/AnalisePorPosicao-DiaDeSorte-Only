{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2>
                    <i class="bi bi-grid-3x3-gap"></i> Análise de Quadrantes do Volante
                </h2>
                <div>
                    <a href="/" class="btn btn-secondary me-2">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                    <button class="btn btn-primary" onclick="carregarAnalise()">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>
            </div>
            <p class="text-muted">
                Análise completa baseada na disposição REAL do volante (10 colunas x 4 linhas)
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-3">Carregando análise...</p>
            </div>

            <div id="resultado" style="display: none;"></div>
        </div>
    </div>

    <!-- Insights Card -->
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm mt-4" id="insightsCard" style="display: none;">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-lightbulb-fill"></i> Insights Inteligentes
                    </h5>
                </div>
                <div class="card-body">
                    <div id="insightsContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Estilo do Volante - Layout 10 colunas x 4 linhas
   Cores padrão Dia de Sorte: #D4B31A (amarelo/dourado) */
.volante-container {
    background: linear-gradient(135deg, #5b4c0b 0%, #887211 100%);
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 30px;
}

.volante-titulo {
    background-color: #D4B31A;
    color: #2d2606;
    text-align: center;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 8px;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

/* Grid do volante - 10 colunas */
.volante-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    max-width: 700px;
    margin: 0 auto;
    background: #f9f2d2;
    padding: 15px;
    border-radius: 10px;
    border: 3px solid #D4B31A;
}

/* Números com cores por quadrante */
.numero-cell {
    border: 2px solid #333;
    color: #000;
    font-weight: bold;
    font-size: 16px;
    text-align: center;
    padding: 8px 4px 4px 4px;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    transition: all 0.3s ease;
    margin: 0 auto;
}

/* Cores por Quadrante - Tons de amarelo/dourado */
.numero-cell.q1 { background-color: #e6c533; border-color: #b69816; }
.numero-cell.q2 { background-color: #f4e5a4; border-color: #ccab19; }
.numero-cell.q3 { background-color: #D4B31A; border-color: #9f8514; }
.numero-cell.q4 { background-color: #eed877; border-color: #b69816; }
.numero-cell.q5 { background-color: #887211; border-color: #5b4c0b; color: #fff; }

.numero-cell:hover {
    transform: scale(1.15);
    box-shadow: 0 4px 12px rgba(212, 179, 26, 0.6);
    z-index: 10;
}

.freq-numero {
    font-size: 9px;
    font-weight: 600;
    margin-top: -2px;
}

.freq-max { color: #28a745; }
.freq-min { color: #dc3545; }
.freq-normal { color: #444; }

/* Quadrantes labels - Cores coordenadas */
.quadrantes-overlay {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 700px;
    margin: 15px auto 0;
}

.quadrante-label-box {
    padding: 10px;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
}

.q1-label { background: #e6c533; color: #2d2606; border: 2px solid #b69816; }
.q2-label { background: #f4e5a4; color: #2d2606; border: 2px solid #ccab19; }
.q3-label { background: #D4B31A; color: #2d2606; border: 2px solid #9f8514; }
.q4-label { background: #eed877; color: #2d2606; border: 2px solid #b69816; }
.q5-label { background: #887211; color: #fff; border: 2px solid #5b4c0b; }

/* Estatísticas */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.stat-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
    background: #fff;
}

.stat-card h6 {
    color: #666;
    margin-bottom: 5px;
    font-size: 12px;
}

.stat-card .valor {
    font-size: 24px;
    font-weight: bold;
    color: #333;
}

.stat-card .media {
    font-size: 11px;
    color: #888;
}

/* Top 3 Linhas */
.top3-linhas {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 15px;
}

.linha-item {
    display: flex;
    align-items: center;
    padding: 10px 15px;
    margin-bottom: 8px;
    background: white;
    border-radius: 6px;
    border-left: 4px solid #28a745;
}

.linha-item .medalha {
    font-size: 20px;
    margin-right: 10px;
}

.linha-item .nome {
    flex: 1;
    font-weight: 500;
}

.linha-item .freq {
    background: #28a745;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bold;
}

/* Cruzamento Quadrante x Linha */
.cruzamento-container {
    max-height: 300px;
    overflow-y: auto;
}

.cruzamento-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
}

.cruzamento-item:hover {
    background: #f8f9fa;
}

/* Cores para análises */
.analise-box {
    border-left: 4px solid;
    padding: 10px 15px;
    margin-bottom: 10px;
    background-color: #f8f9fa;
    border-radius: 5px;
}

.analise-box.tipo-linha { border-color: #28a745; }
.analise-box.tipo-coluna { border-color: #17a2b8; }
.analise-box.tipo-regiao { border-color: #ffc107; }
.analise-box.tipo-vizinho { border-color: #dc3545; }

@media (max-width: 768px) {
    .volante-grid {
        gap: 2px;
    }
    .numero-cell {
        width: 32px;
        height: 32px;
        font-size: 11px;
        padding: 4px 2px 2px 2px;
    }
    .freq-numero {
        font-size: 7px;
    }
    .stats-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let chartQuadrantes = null;

function carregarAnalise() {
    const loading = document.getElementById('loading');
    const resultado = document.getElementById('resultado');

    loading.style.display = 'block';
    resultado.style.display = 'none';
    document.getElementById('insightsCard').style.display = 'none';

    fetch('/api/analise/quadrantes-volante')
        .then(response => response.json())
        .then(data => {
            exibirResultado(data);
            gerarInsights(data);
            loading.style.display = 'none';
        })
        .catch(error => {
            console.error('Erro:', error);
            loading.style.display = 'none';
            resultado.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Erro ao carregar análise: ${error.message}
                </div>
            `;
            resultado.style.display = 'block';
        });
}

function exibirResultado(data) {
    const resultado = document.getElementById('resultado');
    const medalhas = ['🥇', '🥈', '🥉'];

    let html = `
        <!-- VOLANTE VISUAL - LAYOUT 10 COLUNAS -->
        <div class="card shadow-lg mb-4">
            <div class="card-body p-0">
                <div class="volante-container">
                    <div class="volante-titulo">
                        <i class="bi bi-grid-3x3-gap"></i> QUADRANTES DA DIA DE SORTE
                    </div>

                    <!-- Grid 10 colunas x 4 linhas -->
                    <div class="volante-grid">
                        ${renderVolanteCompleto(data)}
                    </div>

                    <!-- Labels dos Quadrantes -->
                    <div class="quadrantes-overlay">
                        <div class="quadrante-label-box q1-label">
                            Q1: Superior Esquerdo (01-05, 11-15) - ${data.frequencia_por_quadrante[1]} ocorrências
                        </div>
                        <div class="quadrante-label-box q2-label">
                            Q2: Superior Direito (06-10, 16-20) - ${data.frequencia_por_quadrante[2]} ocorrências
                        </div>
                        <div class="quadrante-label-box q3-label">
                            Q3: Inferior Esquerdo (21-25) - ${data.frequencia_por_quadrante[3]} ocorrências
                        </div>
                        <div class="quadrante-label-box q4-label">
                            Q4: Inferior Direito (26-30) - ${data.frequencia_por_quadrante[4]} ocorrências
                        </div>
                    </div>
                    <div class="text-center mt-2">
                        <span class="quadrante-label-box q5-label" style="display: inline-block;">
                            Q5: Isolado (31) - ${data.frequencia_por_quadrante[5]} ocorrências
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Coluna Esquerda -->
            <div class="col-lg-6">
                <!-- ESTATÍSTICAS POR QUADRANTE -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-bar-chart-fill"></i> Estatísticas por Quadrante (${data.total_concursos} concursos)
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="stats-grid">
                            ${[1,2,3,4,5].map(q => `
                                <div class="stat-card">
                                    <h6>Q${q}</h6>
                                    <div class="valor">${data.frequencia_por_quadrante[q]}</div>
                                    <div class="media">μ ${data.media_quadrantes[q]}</div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Gráfico de Distribuição -->
                        <div class="mt-4">
                            <canvas id="chartQuadrantes" height="120"></canvas>
                        </div>
                    </div>
                </div>

                <!-- TOP 3 LINHAS -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-list-ol"></i> Top 3 Linhas Mais Frequentes
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="top3-linhas">
                            ${data.top3_linhas.map((l, idx) => `
                                <div class="linha-item">
                                    <span class="medalha">${medalhas[idx]}</span>
                                    <span class="nome">${l.linha}</span>
                                    <span class="freq">${l.frequencia}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <!-- CRUZAMENTO QUADRANTE x LINHA -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-info text-white py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-grid"></i> Cruzamento Quadrante x Linha (Top 10)
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="cruzamento-container">
                            ${Object.entries(data.cruzamento_quadrante_linha).slice(0, 10).map(([chave, freq], idx) => `
                                <div class="cruzamento-item">
                                    <span>
                                        ${idx < 3 ? medalhas[idx] : (idx + 1) + 'º'}
                                        <strong class="ms-2">${chave}</strong>
                                    </span>
                                    <span class="badge bg-info">${freq} vezes</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <!-- ANÁLISE DE VIZINHOS -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-danger text-white py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-diagram-3-fill"></i> Análise de Números Vizinhos
                        </h6>
                    </div>
                    <div class="card-body py-3">
                        <div class="analise-box tipo-vizinho">
                            <p class="mb-0">
                                <strong>${data.analise_vizinhos.percentual}%</strong> dos números sorteados
                                aparecem com pelo menos um vizinho no volante
                                (${data.analise_vizinhos.total_com_vizinhos} de ${data.analise_vizinhos.total_numeros} números)
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita -->
            <div class="col-lg-6">
                <!-- TOP PADRÕES -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-trophy-fill"></i> Top 20 Padrões Mais Frequentes
                        </h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                            <table class="table table-hover table-striped table-sm mb-0">
                                <thead class="table-dark sticky-top">
                                    <tr>
                                        <th>#</th>
                                        <th>Padrão</th>
                                        <th>Q1</th>
                                        <th>Q2</th>
                                        <th>Q3</th>
                                        <th>Q4</th>
                                        <th>Q5</th>
                                        <th>Freq</th>
                                        <th>%</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.padroes.slice(0, 20).map((p, idx) => `
                                        <tr class="${idx < 3 ? 'table-warning' : ''}">
                                            <td><strong>${idx < 3 ? medalhas[idx] : (idx + 1)}</strong></td>
                                            <td><code style="font-size: 10px;">${p.padrao}</code></td>
                                            <td>${p.q1}</td>
                                            <td>${p.q2}</td>
                                            <td>${p.q3}</td>
                                            <td>${p.q4}</td>
                                            <td>${p.q5}</td>
                                            <td><span class="badge bg-primary">${p.frequencia}x</span></td>
                                            <td>${p.percentual}%</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- ANÁLISE DE LINHAS -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-arrows-expand"></i> Distribuição por Linhas
                        </h6>
                    </div>
                    <div class="card-body py-3">
                        <div style="max-height: 250px; overflow-y: auto;">
                            ${Object.entries(data.analise_linhas)
                                .sort((a, b) => b[1] - a[1])
                                .slice(0, 12).map(([linha, freq]) => `
                                <div class="analise-box tipo-linha mb-2 py-2">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="small"><strong>${linha}</strong></span>
                                        <span class="badge bg-success">${freq} vezes</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <!-- ANÁLISE DE REGIÕES -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-warning text-dark py-2">
                        <h6 class="mb-0">
                            <i class="bi bi-flag-fill"></i> Análise por Regiões
                        </h6>
                    </div>
                    <div class="card-body py-3">
                        <div class="row">
                            ${Object.entries(data.analise_regioes)
                                .sort((a, b) => b[1] - a[1])
                                .slice(0, 6).map(([regiao, freq]) => `
                                <div class="col-6 mb-2">
                                    <div class="analise-box tipo-regiao py-2">
                                        <small><strong>${regiao}</strong></small><br>
                                        <span class="badge bg-warning text-dark">${freq}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;

    resultado.innerHTML = html;
    resultado.style.display = 'block';

    // Renderizar gráfico
    setTimeout(() => {
        renderizarGraficoQuadrantes(data);
    }, 100);
}

function renderVolanteCompleto(data) {
    let html = '';

    // Função para determinar o quadrante de cada número
    function getQuadrante(n) {
        if ([1,2,3,4,5,11,12,13,14,15].includes(n)) return 'q1';
        if ([6,7,8,9,10,16,17,18,19,20].includes(n)) return 'q2';
        if ([21,22,23,24,25].includes(n)) return 'q3';
        if ([26,27,28,29,30].includes(n)) return 'q4';
        if (n === 31) return 'q5';
        return '';
    }

    // Renderizar 31 números em formato 10 colunas
    for (let n = 1; n <= 31; n++) {
        const freqNum = data.frequencia_numeros[n] || 0;
        let freqClass = 'freq-normal';
        if (freqNum === data.max_freq) freqClass = 'freq-max';
        else if (freqNum === data.min_freq) freqClass = 'freq-min';

        const qClass = getQuadrante(n);

        html += `
            <div class="numero-cell ${qClass}" title="Número ${n} - ${qClass.toUpperCase()}: ${freqNum} ocorrências">
                <span>${String(n).padStart(2, '0')}</span>
                <span class="freq-numero ${freqClass}">${freqNum}</span>
            </div>
        `;

        // Após o 31, adicionar células vazias para completar a linha
        if (n === 31) {
            for (let i = 0; i < 9; i++) {
                html += `<div></div>`;
            }
        }
    }

    return html;
}

function renderizarGraficoQuadrantes(data) {
    const ctx = document.getElementById('chartQuadrantes');
    if (!ctx) return;

    if (chartQuadrantes) {
        chartQuadrantes.destroy();
    }

    const labels = ['Q1\n(01-05,11-15)', 'Q2\n(06-10,16-20)', 'Q3\n(21-25)', 'Q4\n(26-30)', 'Q5\n(31)'];
    const valores = [1,2,3,4,5].map(q => data.frequencia_por_quadrante[q]);

    chartQuadrantes = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Frequência',
                data: valores,
                backgroundColor: [
                    '#e6c533', '#f4e5a4', '#D4B31A', '#eed877', '#887211'
                ],
                borderColor: ['#b69816', '#ccab19', '#9f8514', '#b69816', '#5b4c0b'],
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: { display: false },
                title: {
                    display: true,
                    text: 'Distribuição por Quadrante',
                    font: { size: 14 }
                }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

function gerarInsights(data) {
    const insightsCard = document.getElementById('insightsCard');
    const insightsContent = document.getElementById('insightsContent');

    const top3 = data.padroes.slice(0, 3);
    const medalhas = ['🥇', '🥈', '🥉'];

    // Encontrar quadrante mais e menos frequente
    const freqs = Object.entries(data.media_quadrantes);
    const quadranteMax = freqs.reduce((a, b) => a[1] > b[1] ? a : b);
    const quadranteMin = freqs.reduce((a, b) => a[1] < b[1] ? a : b);

    // Encontrar número mais frequente
    const numFreqs = Object.entries(data.frequencia_numeros);
    const numeroMax = numFreqs.reduce((a, b) => a[1] > b[1] ? a : b);

    let html = `
        <div class="row">
            <div class="col-md-6 mb-4">
                <h6 class="fw-bold"><i class="bi bi-trophy-fill text-warning"></i> Top 3 Padrões:</h6>
                <ul class="list-group">
                    ${top3.map((p, idx) => `
                        <li class="list-group-item d-flex justify-content-between">
                            <span>${medalhas[idx]} <code>${p.padrao}</code></span>
                            <span>
                                <span class="badge bg-primary">${p.frequencia}x</span>
                                <span class="badge bg-info">${p.percentual}%</span>
                            </span>
                        </li>
                    `).join('')}
                </ul>
            </div>

            <div class="col-md-6 mb-4">
                <div class="alert alert-success mb-2">
                    <h6><i class="bi bi-graph-up-arrow"></i> Quadrante Mais Frequente:</h6>
                    <p class="mb-0">
                        <strong>Q${quadranteMax[0]}</strong> com média de
                        <strong>${quadranteMax[1]}</strong> números por sorteio
                    </p>
                </div>
                <div class="alert alert-warning mb-2">
                    <h6><i class="bi bi-graph-down-arrow"></i> Quadrante Menos Frequente:</h6>
                    <p class="mb-0">
                        <strong>Q${quadranteMin[0]}</strong> com média de
                        <strong>${quadranteMin[1]}</strong> números por sorteio
                    </p>
                </div>
                <div class="alert alert-info mb-0">
                    <h6><i class="bi bi-star-fill"></i> Número Mais Sorteado:</h6>
                    <p class="mb-0">
                        <strong>${String(numeroMax[0]).padStart(2, '0')}</strong> com
                        <strong>${numeroMax[1]}</strong> ocorrências
                    </p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="alert alert-secondary">
                    <h6><i class="bi bi-lightbulb"></i> Dica de Apostas:</h6>
                    <p class="mb-0">
                        A <strong>${data.top3_linhas[0].linha}</strong> é a linha mais frequente.
                        Combine números desta linha com os quadrantes Q${quadranteMax[0]} para melhores chances!
                    </p>
                </div>
            </div>
        </div>
    `;

    insightsContent.innerHTML = html;
    insightsCard.style.display = 'block';
}

window.onload = function() {
    carregarAnalise();
};
</script>
{% endblock %}
